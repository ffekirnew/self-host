services:
  glance:
    build:
      context: ./glance
    container_name: glance
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./glance/config:/app/config
  gpu-stats:
    build:
      context: ./gpu-stats
    container_name: gpu-stats
    networks:
      - default
    # intel_gpu_top reads the i915 PMU; PERFMON is enough, no need for privileged
    cap_add:
      - PERFMON
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
networks:
  default:
    external: true
    name: proxy
