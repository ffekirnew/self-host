pages:
  - name: Ffserver
    hide-desktop-navigation: true
    width: wide
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 12h
            timezones:
              - timezone: Africa/Nairobi
                label: Addis Abeba
              - timezone: Europe/London
                label: London
          - type: calendar
            first-day-of-week: monday
          - type: server-stats
            servers:
              - type: local
                name: Services
          - type: custom-api
            title: VPN
            cache: 1m
            url: http://gluetun:8000/v1/publicip/ip
            subrequests:
              status:
                url: http://gluetun:8000/v1/vpn/status
            template: |
              {{ $up := eq ((.Subrequest "status").JSON.String "status") "running" }}
              <div class="flex justify-between items-center">
                <div class="size-h3 {{ if $up }}color-positive{{ else }}color-negative{{ end }}">{{ if $up }}Connected{{ else }}Down{{ end }}</div>
                <div class="size-h5">NordVPN</div>
              </div>
              {{ if $up }}
              <ul class="list list-gap-10 margin-top-10">
                <li>IP <span class="color-highlight">{{ .JSON.String "public_ip" }}</span></li>
                <li>{{ .JSON.String "city" }}, {{ .JSON.String "country" }}</li>
              </ul>
              {{ end }}
          - type: custom-api
            title: GPU
            cache: 10s
            url: http://gpu-stats:8080
            template: |
              <div class="flex justify-between items-center">
                <div class="size-h3 {{ if gt (.JSON.Float "video") 0.0 }}color-positive{{ end }}">{{ if gt (.JSON.Float "video") 0.0 }}Transcoding{{ else }}Idle{{ end }}</div>
                <div class="size-h5">{{ .JSON.Int "frequency_mhz" }} MHz</div>
              </div>
              <ul class="list list-gap-10 margin-top-10">
                <li>Video (decode/encode) <span class="color-highlight">{{ .JSON.Float "video" }}%</span></li>
                <li>Render/compute <span class="color-highlight">{{ .JSON.Float "render" }}%</span></li>
                <li>Video enhance <span class="color-highlight">{{ .JSON.Float "video_enhance" }}%</span></li>
                <li>Power <span class="color-highlight">{{ .JSON.Float "power_w" }} W</span></li>
              </ul>
      - size: full
        widgets:
          - type: search
            search-engine: google
            bangs:
              - title: YouTube
                shortcut: "!yt"
                url: https://www.youtube.com/results?search_query={QUERY}
          - type: monitor
            title: Services
            sites:
              - title: Navidrome
                icon: di:navidrome
                url: https://navidrome.ffserver.cc
                check-url: http://navidrome:4533
              - title: Jellyfin
                icon: di:jellyfin
                url: https://jellyfin.ffserver.cc
                check-url: http://jellyfin:8096
              - title: Excalidraw
                icon: di:excalidraw
                url: https://draw.ffserver.cc
                check-url: http://excalidraw:80
              - title: Seerr
                icon: di:jellyseerr
                url: https://seerr.ffserver.cc
                check-url: http://seerr:5055/api/v1/status
              - title: Tandoor
                icon: di:tandoor-recipes
                url: https://recipes.ffserver.cc
                check-url: http://tandoor:80
              - title: AdventureLog
                icon: di:adventurelog
                url: https://adventures.ffserver.cc
                check-url: http://adventurelog:80/health
              - title: Ghost
                icon: di:ghost
                url: https://blog.ffserver.cc
                check-url: http://ghost:2368/ghost/api/admin/site/
          - type: monitor
            title: Media pipeline
            # local-only UIs: the links work on the server itself (or over `ssh -L`)
            sites:
              - title: Sonarr
                icon: di:sonarr
                url: http://localhost:8989
                check-url: http://sonarr:8989/ping
              - title: Radarr
                icon: di:radarr
                url: http://localhost:7878
                check-url: http://radarr:7878/ping
              - title: Lidarr
                icon: di:lidarr
                url: http://localhost:8686
                check-url: http://lidarr:8686/ping
              - title: Bazarr
                icon: di:bazarr
                url: http://localhost:6767
                check-url: http://bazarr:6767
              - title: Prowlarr
                icon: di:prowlarr
                url: http://localhost:9696
                check-url: http://prowlarr:9696/ping
              - title: qBittorrent
                icon: di:qbittorrent
                url: http://localhost:9090
                check-url: http://gluetun:9090
          - type: videos
            channels:
              - UCUyeluBRhGPCW4rPe_UvBZQ # ThePrimeTime
              - UC8ENHE5xdFSwx71u3fDH5Xw # ThePrimeagen
              - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
              - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium
          - type: videos
            channels:
              - UCJD-UtyBgYWqvmp_lknn7Lg # Wechew Good
              - UCzUjeR-Wgr0_iyL_brgx3Fw # Shitsxgigs Podcast
              - UC6yW44UGJJBvYTlfC7CRg2Q # Man United
      - size: small
        widgets:
          - type: weather
            location: London, United Kingdom
            units: metric
            hour-format: 12h
          - type: weather
            location: Addis Ababa, Ethiopia
            units: metric
            hour-format: 12h
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: NVDA
                name: NVIDIA
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft
