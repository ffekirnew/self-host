services:
  excalidraw:
    build:
      context: ./excalidraw
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - default
  tandoor-db:
    build:
      context: ./tandoor-db
    container_name: tandoor-db
    networks:
      - default
    environment:
      - POSTGRES_DB=tandoor
      - POSTGRES_USER=tandoor
      - POSTGRES_PASSWORD=${TANDOOR_DB_PASSWORD}
    volumes:
      - ~/home-server/tandoor/postgres:/var/lib/postgresql/data
    restart: unless-stopped
  tandoor:
    build:
      context: ./tandoor
    container_name: tandoor
    networks:
      - default
    depends_on:
      - tandoor-db
    environment:
      - TZ=Europe/London
      - SECRET_KEY=${TANDOOR_SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=tandoor-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tandoor
      - POSTGRES_USER=tandoor
      - POSTGRES_PASSWORD=${TANDOOR_DB_PASSWORD}
      # "tandoor" so glance's health check (http://tandoor:80) is accepted
      - ALLOWED_HOSTS=recipes.ffserver.cc,tandoor
      - CSRF_TRUSTED_ORIGINS=https://recipes.ffserver.cc
      - ENABLE_SIGNUP=0
      - GUNICORN_WORKERS=2
    volumes:
      - tandoor-static:/opt/recipes/staticfiles
      - ~/home-server/tandoor/mediafiles:/opt/recipes/mediafiles
    restart: unless-stopped
  adventurelog-db:
    build:
      context: ./adventurelog-db
    container_name: adventurelog-db
    networks:
      - default
    environment:
      - POSTGRES_DB=adventurelog
      - POSTGRES_USER=adventurelog
      - POSTGRES_PASSWORD=${ADVENTURELOG_DB_PASSWORD}
    volumes:
      - ~/home-server/adventurelog/postgres:/var/lib/postgresql/data
    restart: unless-stopped
  adventurelog:
    build:
      context: ./adventurelog
    container_name: adventurelog
    networks:
      - default
    depends_on:
      - adventurelog-db
    environment:
      # CSRF origins, frontend and public URLs are all derived from SITE_URL
      - SITE_URL=https://adventures.ffserver.cc
      # set explicitly: otherwise a new one is generated on every start, logging everyone out
      - SECRET_KEY=${ADVENTURELOG_SECRET_KEY}
      - PGHOST=adventurelog-db
      - POSTGRES_DB=adventurelog
      - POSTGRES_USER=adventurelog
      - POSTGRES_PASSWORD=${ADVENTURELOG_DB_PASSWORD}
      # superuser is created on first boot only; change the password in the app afterwards.
      # The entrypoint looks the superuser up by username on every start and tries to create it
      # if missing, so this must match the existing admin account or it crash-loops on the email.
      - DJANGO_ADMIN_USERNAME=ffekirnew
      - DJANGO_ADMIN_PASSWORD=${ADVENTURELOG_ADMIN_PASSWORD}
      - DJANGO_ADMIN_EMAIL=admin@ffserver.cc
      - DISABLE_REGISTRATION=True
      - GUNICORN_WORKERS=2
    volumes:
      - ~/home-server/adventurelog/media:/code/media
    restart: unless-stopped
  ghost-db:
    build:
      context: ./ghost-db
    container_name: ghost-db
    networks:
      - default
    environment:
      - MYSQL_DATABASE=ghost
      - MYSQL_USER=ghost
      - MYSQL_PASSWORD=${GHOST_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${GHOST_DB_ROOT_PASSWORD}
    volumes:
      - ~/home-server/ghost/mysql:/var/lib/mysql
    restart: unless-stopped
  ghost:
    build:
      context: ./ghost
    container_name: ghost
    networks:
      - default
    depends_on:
      - ghost-db
    environment:
      # public URL: links, redirects and the admin all depend on it
      - url=https://blog.ffserver.cc
      - database__client=mysql
      - database__connection__host=ghost-db
      - database__connection__user=ghost
      - database__connection__password=${GHOST_DB_PASSWORD}
      - database__connection__database=ghost
      # new-device logins email a code; no SMTP is configured, so this would lock out the admin
      - security__staffDeviceVerification=false
    volumes:
      - ~/home-server/ghost/content:/var/lib/ghost/content
    restart: unless-stopped
volumes:
  tandoor-static:
networks:
  default:
    external: true
    name: proxy
