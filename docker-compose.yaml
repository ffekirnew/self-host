services:
  gluetun:
    build:
      context: ./gluetun
    container_name: gluetun
    networks:
      - default
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Europe/London
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${NORDVPN_USER}
      - OPENVPN_PASSWORD=${NORDVPN_PASSWORD}
      - SERVER_COUNTRIES=United Kingdom
      # the server list baked into the image goes stale (Nord rotates IPs); refresh it daily
      - UPDATER_PERIOD=24h
    volumes:
      - ~/home-server/gluetun:/gluetun
      - ./gluetun/auth/config.toml:/gluetun/auth/config.toml:ro
    ports:
      - 127.0.0.1:9090:9090 # qbittorrent Web UI
    restart: unless-stopped
  qbittorrent:
    build:
      context: ./qbittorrent
    container_name: qbittorrent
    # all traffic goes through the VPN; if gluetun is down, qbittorrent has no network
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - TZ=Europe/London
      - WEBUI_PORT=9090
      - TORRENTING_PORT=6881
    volumes:
      - ~/home-server/.config/qbittorrent:/config
      - ~/home-server/qbittorrent/downloads:/downloads
    restart: unless-stopped
  jackett:
    build:
      context: ./jackett
    container_name: jackett
    networks:
      - default
    environment:
      - TZ=Europe/London
    volumes:
      - ~/home-server/.config/jackett:/config
      - ~/home-server/jackett/downloads:/downloads
    ports:
      - 127.0.0.1:9117:9117
    restart: unless-stopped
  glance:
    build:
      context: ./glance
    container_name: glance
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./glance/config:/app/config
  navidrome:
    build:
      context: ./navidrome
    container_name: navidrome
    networks:
      - default
    init: true
    restart: unless-stopped
    volumes:
      - ~/home-server/navidrome/data:/data
      - type: bind
        source: ~/home-server/media/music
        target: /music
        read_only: true
  jellyfin:
    build:
      context: ./jellyfin
    container_name: jellyfin
    networks:
      - default
    init: true
    volumes:
      - ~/home-server/jellyfin/srv/jellyfin/config:/config
      - ~/home-server/jellyfin/srv/jellyfin/cache:/cache
      - type: bind
        source: ~/home-server/media
        target: /media
        read_only: true
    restart: "unless-stopped"
  excalidraw:
    build:
      context: ./excalidraw
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - default
  cloudflared:
    build:
      context: ./cloudflared
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - default
    depends_on:
      - navidrome
      - jellyfin
      - glance
      - excalidraw
networks:
  default:
    external: true
    name: proxy
