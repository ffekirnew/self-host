services:
  gluetun:
    build:
      context: ./gluetun
    container_name: gluetun
    networks:
      - default
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Europe/London
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${NORDVPN_USER}
      - OPENVPN_PASSWORD=${NORDVPN_PASSWORD}
      - SERVER_COUNTRIES=United Kingdom
      # the server list baked into the image goes stale (Nord rotates IPs); refresh it daily
      - UPDATER_PERIOD=24h
    volumes:
      - ~/home-server/gluetun:/gluetun
      - ./gluetun/auth/config.toml:/gluetun/auth/config.toml:ro
    ports:
      - 127.0.0.1:9090:9090 # qbittorrent Web UI
    restart: unless-stopped
  qbittorrent:
    build:
      context: ./qbittorrent
    container_name: qbittorrent
    # all traffic goes through the VPN; if gluetun is down, qbittorrent has no network
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=9090
      - TORRENTING_PORT=6881
    volumes:
      - ~/home-server/.config/qbittorrent:/config
      - ~/home-server/data:/data
    restart: unless-stopped
  prowlarr:
    build:
      context: ./prowlarr
    container_name: prowlarr
    networks:
      - default
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/home-server/.config/prowlarr:/config
    ports:
      - 127.0.0.1:9696:9696
    restart: unless-stopped
  flaresolverr:
    build:
      context: ./flaresolverr
    container_name: flaresolverr
    networks:
      - default
    environment:
      - TZ=Europe/London
    restart: unless-stopped
  sonarr:
    build:
      context: ./sonarr
    container_name: sonarr
    networks:
      - default
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/home-server/.config/sonarr:/config
      - ~/home-server/data:/data
    ports:
      - 127.0.0.1:8989:8989
    restart: unless-stopped
  radarr:
    build:
      context: ./radarr
    container_name: radarr
    networks:
      - default
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/home-server/.config/radarr:/config
      - ~/home-server/data:/data
    ports:
      - 127.0.0.1:7878:7878
    restart: unless-stopped
  lidarr:
    build:
      context: ./lidarr
    container_name: lidarr
    networks:
      - default
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/home-server/.config/lidarr:/config
      - ~/home-server/data:/data
    ports:
      - 127.0.0.1:8686:8686
    restart: unless-stopped
  bazarr:
    build:
      context: ./bazarr
    container_name: bazarr
    networks:
      - default
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/home-server/.config/bazarr:/config
      - ~/home-server/data:/data
    ports:
      - 127.0.0.1:6767:6767
    restart: unless-stopped
  seerr:
    build:
      context: ./seerr
    container_name: seerr
    networks:
      - default
    init: true
    environment:
      - TZ=Europe/London
    volumes:
      - ~/home-server/.config/seerr:/app/config
    ports:
      - 127.0.0.1:5055:5055 # for first-time setup; public access goes through the tunnel
    restart: unless-stopped
  glance:
    build:
      context: ./glance
    container_name: glance
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./glance/config:/app/config
  navidrome:
    build:
      context: ./navidrome
    container_name: navidrome
    networks:
      - default
    init: true
    restart: unless-stopped
    volumes:
      - ~/home-server/navidrome/data:/data
      - type: bind
        source: ~/home-server/data/media/music
        target: /music
        read_only: true
  jellyfin:
    build:
      context: ./jellyfin
    container_name: jellyfin
    networks:
      - default
    init: true
    volumes:
      - ~/home-server/jellyfin/srv/jellyfin/config:/config
      - ~/home-server/jellyfin/srv/jellyfin/cache:/cache
      - type: bind
        source: ~/home-server/data/media
        target: /media
        read_only: true
    restart: "unless-stopped"
  excalidraw:
    build:
      context: ./excalidraw
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - default
  cloudflared:
    build:
      context: ./cloudflared
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - default
    depends_on:
      - navidrome
      - jellyfin
      - glance
      - excalidraw
      - seerr
networks:
  default:
    external: true
    name: proxy
